name: Sinhala News Video To Telegram Every Hour

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-sinhala-news-video:
    runs-on: ubuntu-latest

    env:
      PAGE_NAME: "World news in Sinhala"
      VOICE: "si-LK-ThiliniNeural"
      MAX_VIDEOS_PER_RUN: "1"
      VIDEO_SECONDS_MIN: "35"
      VIDEO_SECONDS_MAX: "55"
      USE_NEWS_IMAGES: "true"
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fix folders
        run: |
          if [ -f output ]; then rm output; fi
          if [ -f assets ]; then rm assets; fi
          mkdir -p output
          mkdir -p assets

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu fonts-noto-core fonts-noto-extra fonts-noto-ui-core

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create Sinhala news video
        run: |
          python bot.py

      - name: Send video to Telegram
        run: |
          python telegram_upload.py

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: sinhala-news-video
          path: |
            output/*.mp4
            output/*.json

      - name: Save state file
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add state.json output/*.json || true
          git commit -m "Update Sinhala news video state" || echo "No changes to commit"
          git push || true
